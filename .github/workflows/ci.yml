name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  factory:
    name: AI Factory (artifact validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate factory artifacts
        run: python3 scripts/ai-factory/validate.py

      - name: Test validator
        run: python3 scripts/ai-factory/test_validate.py

  # ─────────────────────────────────────────────
  # Frontend: lint + typecheck + unit tests
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (lint · typecheck · test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm test -- --reporter=verbose

  # ─────────────────────────────────────────────
  # Backend: typecheck + unit tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend (typecheck · unit · integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: neon_arsenal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neon -d neon_arsenal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://neon:ci_password@localhost:5432/neon_arsenal_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npm run test:db:prepare

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit -- --reporter=verbose

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration -- --reporter=verbose

  # ─────────────────────────────────────────────
  # Contract: OpenAPI vs real HTTP handlers (#61)
  # ─────────────────────────────────────────────
  contract:
    name: Contract (OpenAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Contract tests
        run: npm run test:contract -- --reporter=verbose

  # ─────────────────────────────────────────────
  # Security: dependency audit (#69)
  # ─────────────────────────────────────────────
  security:
    name: Security (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Audit backend dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Security: Trivy filesystem (#68)
  # No image registry in this repo; Render builds at deploy. Report-only,
  # same policy as npm audit (docs/operations/ci-protection.md).
  # ─────────────────────────────────────────────
  trivy:
    name: Security (Trivy filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy scan server/ (Dockerfile + lockfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: server
          severity: CRITICAL,HIGH
          exit-code: "0"

  # ─────────────────────────────────────────────
  # Build verification (frontend + backend)
  # ─────────────────────────────────────────────
  build:
    name: Build check
    runs-on: ubuntu-latest
    needs: [frontend, backend, contract, security]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          API_URL: https://api.example.com

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build backend
        working-directory: server
        run: npm run build
