# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect repo on Render dashboard and select this file.
#
# Services provisioned:
#   - neon-arsenal-api  (Web Service — Express backend)
#   - neon-arsenal-db   (PostgreSQL — managed, free tier)

services:
  - type: web
    name: neon-arsenal-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SEED_DEMO_DATA
        # Demo catalog for the public portfolio. Idempotent upserts. Set false
        # on a real marketplace so boots do not re-run seed. See docs/operations/runbook.md.
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: neon-arsenal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_TIMEOUT_MS
        value: "10000"
      - key: FRONTEND_URL
        sync: false
    # Render has a single probe. Use readiness: Postgres reachable and not draining.
    # Docker HEALTHCHECK in server/Dockerfile stays on /health (liveness) so a
    # SIGTERM drain does not look like a dead container.
    healthCheckPath: /ready
    # App drain is 10s (SHUTDOWN_DRAIN_MS). Default platform delay is 30s.
    maxShutdownDelaySeconds: 30
    autoDeploy: true

  - type: web
    name: neon-arsenal-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: neon-arsenal-db
    databaseName: neon_arsenal
    user: neon
    plan: free
