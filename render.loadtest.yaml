# Disposable Render environment used exclusively by .github/workflows/load-test.yml.
# Import this file as a separate Blueprint. It intentionally provisions no frontend
# and must never reuse neon-arsenal-db or production/payments credentials.

services:
  - type: web
    name: neon-arsenal-loadtest-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    autoDeploy: false
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: neon-arsenal-loadtest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PAYPAL_MODE
        value: sandbox
      # Do not copy real payment/email/CS2SH credentials into a load target.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://loadtest.invalid
      - key: CS2SH_IMPORT
        value: "false"

databases:
  - name: neon-arsenal-loadtest-db
    databaseName: neon_arsenal_loadtest
    user: neon_loadtest
    plan: free
